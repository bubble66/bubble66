<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考拉 Koko 的故事画廊</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 700;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .comic-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .comic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .cover-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 20px;
        }
        .comic-title {
            font-size: 1.2em;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        .comic-meta {
            font-size: 0.9em;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐨 考拉 Koko 的故事画廊</h1>
        <div class="gallery">
            <a href="koko-adventure/site/index.html" class="comic-card">
                <img src="https://haohao2023.tos-s3-cn-beijing.volces.com/comics/2026-01-18/koko-adventure/00-cover.png" alt="考拉 Koko 的勇敢一跃" class="cover-image" loading="lazy">
                <div class="card-content">
                    <h2 class="comic-title">考拉 Koko 的勇敢一跃</h2>
                    <div class="comic-meta">Koko's Adventure</div>
                </div>
            </a>
            
            <a href="koko-boomerang/site/index.html" class="comic-card">
                <img src="https://haohao2023.tos-s3-cn-beijing.volces.com/comics/2026-01-18/koko-boomerang/00-cover.png" alt="考拉 Koko 与回旋镖" class="cover-image" loading="lazy">
                <div class="card-content">
                    <h2 class="comic-title">考拉 Koko 与回旋镖</h2>
                    <div class="comic-meta">Koko's Boomerang</div>
                </div>
            </a>
            
            <a href="koko-camping/site/index.html" class="comic-card">
                <img src="https://haohao2023.tos-s3-cn-beijing.volces.com/comics/2026-01-18/koko-camping/00-cover.png" alt="考拉 Koko 去露营" class="cover-image" loading="lazy">
                <div class="card-content">
                    <h2 class="comic-title">考拉 Koko 去露营</h2>
                    <div class="comic-meta">Koko Camping</div>
                </div>
            </a>
            
            <a href="koko-new-friend/site/index.html" class="comic-card">
                <img src="https://haohao2023.tos-s3-cn-beijing.volces.com/comics/2026-01-18/koko-new-friend/00-cover.png" alt="考拉 Koko 的新朋友" class="cover-image" loading="lazy">
                <div class="card-content">
                    <h2 class="comic-title">考拉 Koko 的新朋友</h2>
                    <div class="comic-meta">Koko's New Friend</div>
                </div>
            </a>
            
            <a href="koko-river/site/index.html" class="comic-card">
                <img src="https://haohao2023.tos-s3-cn-beijing.volces.com/comics/2026-01-18/koko-river/00-cover.png" alt="考拉 Koko 过河" class="cover-image" loading="lazy">
                <div class="card-content">
                    <h2 class="comic-title">考拉 Koko 过河</h2>
                    <div class="comic-meta">Koko Crossing the River</div>
                </div>
            </a>
            
            <a href="koko-starry-night/site/index.html" class="comic-card">
                <img src="https://haohao2023.tos-s3-cn-beijing.volces.com/comics/2026-01-18/koko-starry-night/00-cover.png" alt="考拉 Koko 的星空" class="cover-image" loading="lazy">
                <div class="card-content">
                    <h2 class="comic-title">考拉 Koko 的星空</h2>
                    <div class="comic-meta">Koko's Starry Night</div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
